<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flores para Conita ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #d0bfff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
      position: relative;
    }

    .zona-texto {
      margin-top: 40px;
      padding: 0 40px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 100%;
    }

    .contenido {
      padding: 0 20px;
      z-index: 2;
      max-width: 520px;
    }

    h1 {
      color: white;
      font-size: 2rem;
      margin: 0;
      text-shadow: 0 2px 8px rgba(80, 40, 120, 0.25);
    }

    .mensaje {
      margin-top: 14px;
      color: white;
      font-size: 1.1rem;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(80, 40, 120, 0.25);
    }

    .foto-lado {
      width: 240px;
      height: 240px;
      object-fit: cover;
      border-radius: 24px;
      border: 4px solid white;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    /* Flores animadas */

    .flower {
      position: absolute;
      bottom: 0;
      font-size: 2rem;
      animation: grow 5s ease-out forwards;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes grow {
      0% {
        transform: translateY(100px) scale(0.2);
        opacity: 0;
      }

      25% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-250px) scale(1.35);
        opacity: 0;
      }
    }

    /* Botón de música */

    .musica {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 20;
    }

    .boton-musica {
      width: 58px;
      height: 58px;
      padding: 0;
      border: 3px solid white;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 1.6rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(80, 40, 120, 0.25);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .boton-musica:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.6);
    }

    .boton-musica:active {
      transform: scale(0.96);
    }

    /* Reproductor desplegable */

    .reproductor {
      position: absolute;
      left: 0;
      bottom: 72px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px) scale(0.95);
      transform-origin: bottom left;
      transition:
        opacity 0.25s ease,
        visibility 0.25s ease,
        transform 0.25s ease;
    }

    .reproductor.activo {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .reproductor iframe {
      display: block;
      width: 280px;
      height: 158px;
      border: 3px solid white;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(80, 40, 120, 0.3);
      background: black;
    }

    /* Diseño para teléfonos */

    @media (max-width: 800px) {
      body {
        overflow-y: auto;
        padding-bottom: 100px;
      }

      .zona-texto {
        flex-direction: column;
        gap: 15px;
        margin-top: 25px;
        padding: 0 20px;
      }

      .contenido {
        order: -1;
      }

      .foto-lado {
        width: 180px;
        height: 180px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .mensaje {
        font-size: 1rem;
      }

      .musica {
        left: 12px;
        bottom: 12px;
      }

      .boton-musica {
        width: 52px;
        height: 52px;
        font-size: 1.4rem;
      }

      .reproductor {
        bottom: 64px;
      }

      .reproductor iframe {
        width: 220px;
        height: 124px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="zona-texto">

    <img
      class="foto-lado"
      id="fotoIzquierda"
      src=""
      alt="Foto izquierda"
    >

    <div class="contenido">
      <h1>Estas flores son para ti, mi amorcita ❤️</h1>
      <p class="mensaje" id="mensaje"></p>
    </div>

    <img
      class="foto-lado"
      id="fotoDerecha"
      src=""
      alt="Foto derecha"

      id="botonMusica"
      type="button"
      aria-label="Abrir canción"
      aria-expanded="false"

      🎵
    </button>

    <div class="reproductor" id="reproductor">
      <iframe
        src="https://www.youtube.com/embed/videoseries?list=PLaCa-iCqPx8c"
        title="Playlist"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </div>

      flower.textContent =

      flower.style.left = Math.random() * 100 + "%";

      const tamaño = 1.4 + Math.random() * 1.2;
      flower.style.fontSize = tamaño + "rem";

      document.body.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 5000);
    }

      "Estoy taaaan enamorada de ti coni, muero de amor por ti",
      "Tus abrazos son muy calidos, tus besos me llenan de amor, tus nanais son mi lugaar seguro",
      "Siempre haré todo lo que pueda por ver tu sonrisita hermosa, todo esfuerzo vale la pena por ti",
      "Recuerdo cada momento especial contigo, cada foto, cada risa, cada beso, cada conversación, cada regaloneo. Te estoy empezando a amar",
      "Manche tu poleron, upsi, perdoname amorcita"

    function obtenerFraseDiaria() {
      const ahora = new Date();

      const corteHoy = new Date();
      corteHoy.setHours(8, 0, 0, 0);

      let ultimoCorte;

      if (ahora >= corteHoy) {
        ultimoCorte = corteHoy;
      } else {
        ultimoCorte = new Date(corteHoy);
        ultimoCorte.setDate(ultimoCorte.getDate() - 1);
      }

      const año = ultimoCorte.getFullYear();
      const mes = String(ultimoCorte.getMonth() + 1).padStart(2, "0");
      const dia = String(ultimoCorte.getDate()).padStart(2, "0");

      const claveFecha = `${año}-${mes}-${dia}`;

      const fraseGuardada = localStorage.getItem("fraseDiaria");
      const fechaGuardada = localStorage.getItem("fechaFrase");

      if (fraseGuardada && fechaGuardada === claveFecha) {
        return fraseGuardada;
      }

      const nuevaFrase =
        frases[Math.floor(Math.random() * frases.length)];

      localStorage.setItem("fraseDiaria", nuevaFrase);
      localStorage.setItem("fechaFrase", claveFecha);

      return nuevaFrase;
    }

    document.getElementById("mensaje").textContent =

    function mostrarFotosAleatorias() {
      if (fotos.length < 2) {
        return;
      }

      const indiceIzquierda =
        Math.floor(Math.random() * fotos.length);

      let indiceDerecha;

      do {
        indiceDerecha =
          Math.floor(Math.random() * fotos.length);
      } while (indiceDerecha === indiceIzquierda);

      document.getElementById("fotoIzquierda").src =
        fotos[indiceIzquierda];

      document.getElementById("fotoDerecha").src =
        fotos[indiceDerecha];
    }

    mostrarFotosAleatorias();

    /* Abrir y cerrar el reproductor */

    const botonMusica = document.getElementById("botonMusica");
    const reproductor = document.getElementById("reproductor");

    botonMusica.addEventListener("click", () => {
      const estaActivo =
        reproductor.classList.toggle("activo");

      botonMusica.setAttribute(
        "aria-expanded",
        estaActivo.toString()
      );

      botonMusica.textContent = estaActivo ? "✕" : "🎵";
      botonMusica.setAttribute(
        "aria-label",
        estaActivo ? "Cerrar canción" : "Abrir canción"
      );
    });

    /* Cerrar al presionar Escape */

    document.addEventListener("keydown", (evento) => {
      if (
        evento.key === "Escape" &&
        reproductor.classList.contains("activo")
      ) {
        reproductor.classList.remove("activo");
        botonMusica.textContent = "🎵";
        botonMusica.setAttribute("aria-expanded", "false");
        botonMusica.setAttribute("aria-label", "Abrir canción");
      }
    });
  </script>

</html>
