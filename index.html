<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡¡ FELICIDADES POR APROBAR !! ¡¡ PULGUITA ERES PSICÓLOGA 🥳!!</title>
  <style>
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: #100c23 url("fondo-sorpresa.jpg") 65% center / cover no-repeat;
    }

    main {
      position: relative;
      z-index: 1;
      padding: clamp(24px, 7vh, 72px) 20px 0;
      text-align: center;
    }

    h1 {
      margin: 0 auto;
      color: white;
      font: 800 clamp(1.25rem, 3.8vw, 2.6rem)/1.15 system-ui, sans-serif;
      text-wrap: balance;
      text-shadow: 0 2px 8px #100c23, 0 0 24px #100c23;
    }

    .mensaje {
      max-width: 44ch;
      margin: 12px auto 0;
      color: white;
      font: 500 clamp(0.9rem, 2.1vw, 1.1rem)/1.5 system-ui, sans-serif;
      text-shadow: 0 2px 8px #100c23, 0 0 24px #100c23;
    }

    .celebracion {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .baile {
      position: fixed;
      inset-inline: 0;
      bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: clamp(4px, 3vw, 36px);
      pointer-events: none;
    }

    .baile img {
      width: clamp(64px, 18vw, 120px);
      height: auto;
      animation: bailar 800ms ease-in-out infinite alternate;
    }

    .baile img:nth-child(2) { animation-delay: -400ms; }
    .baile img:nth-child(3) { animation-delay: -800ms; }

    @keyframes bailar {
      from { transform: translateY(0) rotate(-12deg); }
      to { transform: translateY(-18px) rotate(12deg); }
    }

    .emoji {
      position: absolute;
      top: 100%;
      left: 50%;
      font-size: var(--tamano);
      line-height: 1;
      animation: subir var(--duracion) linear both;
    }

    @keyframes subir {
      0% { transform: translate(calc(-50% + var(--inicio)), 0); }
      85% { opacity: 1; }
      100% {
        transform: translate(calc(-50% + var(--destino)), calc(-100vh - 2em));
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .celebracion { display: none; }
      .baile img { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>¡¡ FELICIDADES POR APROBAR !!<br>
      ¡¡ PULGUITA ERES PSICÓLOGA 🥳!!</h1>
    <p class="mensaje">siempre supe que lo lograrías, eres muy inteligente amor, te admiro muchísimo ❤️</p>
  </main>
  <div class="celebracion" aria-hidden="true"></div>
  <div class="baile">
    <img src="godcat-transparente.png" alt="Tres Godcat bailando" width="1254" height="1254">
    <img src="godcat-transparente.png" alt="" width="1254" height="1254">
    <img src="godcat-transparente.png" alt="" width="1254" height="1254">
  </div>
  <script>
    const celebracion = document.querySelector(".celebracion");
    const emojis = ["🎉", "🎈", "💐", "🌺", "✨"];
    const reducirMovimiento = matchMedia("(prefers-reduced-motion: reduce)");
    let siguienteEmoji = 0;

    setInterval(() => {
      if (reducirMovimiento.matches) return;

      const emoji = document.createElement("span");
      const duracion = 5000 + Math.random() * 3000;
      const direccion = Math.random() < 0.5 ? -1 : 1;
      emoji.className = "emoji";
      emoji.textContent = emojis[siguienteEmoji];
      siguienteEmoji = (siguienteEmoji + 1) % emojis.length;

      emoji.style.setProperty("--inicio", `${direccion * (28 + Math.random() * 15)}vw`);
      emoji.style.setProperty("--destino", `${direccion * (28 + Math.random() * 15)}vw`);
      emoji.style.setProperty("--tamano", `${1.5 + Math.random() * 1.25}rem`);
      emoji.style.setProperty("--duracion", `${duracion}ms`);
      celebracion.append(emoji);
      setTimeout(() => emoji.remove(), duracion);
    }, 450);
  </script>
</body>
</html>
