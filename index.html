<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🚧 Pagina en remodelación 🏗️</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: #dedede;
      color: #222;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    main {
      max-width: 38rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      line-height: 1.2;
    }

    p {
      margin: 16px 0 0;
      font-size: clamp(1rem, 3vw, 1.15rem);
      line-height: 1.6;
    }

    .cargando {
      position: relative;
      width: 80px;
      aspect-ratio: 1;
      margin: 0 auto 28px;
      animation: girar 1.2s steps(16) infinite;
    }

    .cargando span {
      position: absolute;
      inset: 0;
      transform: rotate(calc(var(--posicion) * 22.5deg));
    }

    .cargando span::before {
      display: block;
      width: 7%;
      height: 21%;
      margin-inline: auto;
      border-radius: 999px;
      background: #161616;
      opacity: calc(1 - var(--posicion) * 0.055);
      content: "";
    }

    @keyframes girar {
      to { transform: rotate(1turn); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cargando {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="cargando" aria-hidden="true">
      <span style="--posicion: 0"></span>
      <span style="--posicion: 1"></span>
      <span style="--posicion: 2"></span>
      <span style="--posicion: 3"></span>
      <span style="--posicion: 4"></span>
      <span style="--posicion: 5"></span>
      <span style="--posicion: 6"></span>
      <span style="--posicion: 7"></span>
      <span style="--posicion: 8"></span>
      <span style="--posicion: 9"></span>
      <span style="--posicion: 10"></span>
      <span style="--posicion: 11"></span>
      <span style="--posicion: 12"></span>
      <span style="--posicion: 13"></span>
      <span style="--posicion: 14"></span>
      <span style="--posicion: 15"></span>
    </div>
    <h1>🚧 Pagina en remodelación 🏗️</h1>
    <p>Ups, lo siento amor, creo que la pagina de tus flores esta indisponible debido a una sorpresa que aparecerá en los próximos días</p>
  </main>
</body>
</html>
