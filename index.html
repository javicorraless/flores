<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flores para Conita ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: #d0bfff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
      position: relative;
    }

    .zona-texto {
      display: grid;
      grid-template-columns: minmax(0, 240px) minmax(0, 520px) minmax(0, 240px);
      grid-template-areas:
        "arriba-izquierda texto arriba-derecha"
        "abajo-izquierda texto abajo-derecha";
      place-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      padding: 40px 24px;
      z-index: 2;
    }

    #fotoIzquierda { grid-area: arriba-izquierda; }
    #fotoDerecha { grid-area: arriba-derecha; }
    #fotoAbajoIzquierda { grid-area: abajo-izquierda; }
    #fotoAbajoDerecha { grid-area: abajo-derecha; }

    .contenido {
      grid-area: texto;
      padding: 0 20px;
      z-index: 2;
      max-width: 520px;
    }

    h1 {
      color: white;
      font-size: 2rem;
      margin: 0;
      text-shadow: 0 2px 8px rgba(80, 40, 120, 0.25);
    }

    .mensaje {
      margin-top: 14px;
      color: white;
      font-size: 1.1rem;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(80, 40, 120, 0.25);
    }

    .foto-lado {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 24px;
      border: 4px solid white;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }

    /* Flores animadas */

    .flower {
      position: absolute;
      bottom: 0;
      font-size: 2rem;
      animation: grow 5s ease-out forwards;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes grow {
      0% {
        transform: translateY(100px) scale(0.2);
        opacity: 0;
      }

      25% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-250px) scale(1.35);
        opacity: 0;
      }
    }

    @media (max-width: 800px) {
      .zona-texto {
        grid-template-columns: repeat(2, minmax(0, 240px));
        grid-template-areas:
          "texto texto"
          "arriba-izquierda arriba-derecha"
          "abajo-izquierda abajo-derecha";
        gap: 12px;
        padding: 25px 16px;
      }

      .contenido {
        padding: 0;
      }

      h1 {
        font-size: 1.6rem;
      }

      .mensaje {
        font-size: 1rem;
      }
    }
  </style>
</head>

      const tamaño = 1.4 + Math.random() * 1.2;
      flower.style.fontSize = tamaño + "rem";

      setTimeout(() => {
        flower.remove();
      }, 5000);

      const año = ultimoCorte.getFullYear();
      const mes = String(ultimoCorte.getMonth() + 1).padStart(2, "0");
      const dia = String(ultimoCorte.getDate()).padStart(2, "0");

      const claveFecha = `${año}-${mes}-${dia}`;

      const fraseGuardada = localStorage.getItem("fraseDiaria");

      }

        frases[Math.floor(Math.random() * frases.length)];

      localStorage.setItem("fraseDiaria", nuevaFrase);
      localStorage.setItem("fechaFrase", claveFecha);

    function mostrarFotosAleatorias() {
      const disponibles = [...fotos];
      const espacios = document.querySelectorAll(".foto-lado");

      for (const espacio of espacios) {
        if (disponibles.length === 0) break;

        const indice = Math.floor(Math.random() * disponibles.length);
        const [foto] = disponibles.splice(indice, 1);
        espacio.src = foto;
      }
    }
